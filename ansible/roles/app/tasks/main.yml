# --- Настройка Systemd Service ---

# 1. Создаем Unit-файл для systemd
- name: Create systemd service unit file
  ansible.builtin.template:
    src: nodeservice.service.j2 # Будет создан в папке templates/
    dest: /etc/systemd/system/{{ app_service_name }}.service
    owner: root
    group: root
    mode: '0644'
  notify: 
    - Reload systemd
    - Restart nodeservice

# 2. Запускаем и включаем сервис
- name: Start and enable the Node.js service
  ansible.builtin.systemd:
    name: "{{ app_service_name }}"
    state: started
    enabled: yes
    daemon_reload: yes